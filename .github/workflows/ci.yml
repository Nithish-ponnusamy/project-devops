
name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check application file
        run: test -s app/index.html

      - name: Build Docker image
        run: docker build -t devops-web:${{ github.sha }} .
